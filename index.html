
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photography Gallery | Subhomoments</title>
<meta name="description" content="Subhomoments photography galleries and cinematic films.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
--paper:#fbf8f3;
--ink:#26201c;
--gold:#a77a58;
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--paper);
color:var(--ink);
font:16px/1.6 "DM Sans",sans-serif;
}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}
header{
position:sticky;
top:0;
background:#fbf8f3f5;
z-index:10;
border-bottom:1px solid #e8dfd6;
}
.wrap{
width:min(1320px,calc(100% - 32px));
margin:auto;
}
.top{
min-height:75px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}
.brand{
font:30px "Playfair Display",serif;
}
.brand span{color:var(--gold)}
.back{font-weight:600;font-size:14px}
.banner{
background:#211b18;
color:white;
padding:65px 16px;
text-align:center;
}
.banner h1{
font:clamp(32px,5vw,60px) "Playfair Display",serif;
margin:8px 0;
}
.banner p{color:#d9cbc0;margin:0}
.eyebrow{
color:#c7a27f;
text-transform:uppercase;
letter-spacing:.22em;
font-size:12px;
font-weight:700;
}

/* CATEGORY BUTTONS */
.categories{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:27px 0 10px;
}
.categories a{
border:1px solid #cbbba9;
padding:10px 16px;
font-size:14px;
font-weight:700;
}
.categories a.active,
.categories a:hover{
background:#8e2436;
color:white;
border-color:#8e2436;
}

/* PHOTO GALLERY */
.section{padding:45px 0}
.section h2{
font:clamp(27px,4vw,43px) "Playfair Display",serif;
margin:0 0 5px;
}
.subtitle{
color:#756b63;
margin:0 0 30px;
}

/*
Masonry columns preserve natural image ratios.
Portrait photos remain tall.
Landscape photos remain wide.
No object-fit:cover cropping is applied.
*/
.masonry{
columns:4 230px;
column-gap:12px;
}
.photo{
display:block;
width:100%;
break-inside:avoid;
margin:0 0 12px;
border:0;
background:#e9e1d7;
padding:0;
}
.photo img{
width:100%;
height:auto;
display:block;
}
.photo:hover img{
filter:brightness(.88);
}

/* VIDEO GALLERY */
.videos{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:20px;
}
.video{
background:white;
box-shadow:0 5px 20px #00000012;
}
.video iframe{
width:100%;
aspect-ratio:16/9;
border:0;
display:block;
}
.video h3{
font-size:17px;
margin:12px 15px 18px;
}
.empty{
padding:25px;
background:#f0e8dd;
color:#6c5d52;
}

/* FULL SCREEN PHOTO VIEWER */
.lightbox{
position:fixed;
inset:0;
background:#000e;
z-index:50;
display:none;
align-items:center;
justify-content:center;
padding:50px 20px;
}
.lightbox.open{display:flex}
.lightbox img{
max-width:95vw;
max-height:90vh;
object-fit:contain;
}
.close{
position:absolute;
right:20px;
top:10px;
background:none;
border:0;
color:white;
font-size:40px;
}

footer{
background:#211d1b;
color:#eee;
text-align:center;
padding:32px 10px;
margin-top:45px;
}
@media(max-width:700px){
.videos{grid-template-columns:1fr}
.banner{padding:45px 15px}
.categories a{font-size:12px;padding:9px 11px}
}
@media(min-width:701px) and (max-width:1000px){
.videos{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
<div class="wrap top">
<a class="brand" href="index.html">
Subho<span>moments</span>
</a>
<a class="back" href="index.html">← Back to Home</a>
</div>
</header>

<!-- PAGE TITLE -->
<div class="banner">
<div class="eyebrow">Photography & Cinematic Films</div>
<h1 id="pageTitle">Our Gallery</h1>
<p>Real emotions. Beautiful stories. Forever memories.</p>
</div>

<main class="wrap">

<!-- CATEGORY SELECTION -->
<nav class="categories" id="categories" aria-label="Gallery categories"></nav>

<!-- PHOTO SECTION -->
<section class="section" id="photos">
<h2>Photo Gallery</h2>
<p class="subtitle">
Original portrait and landscape proportions, without cropping.
</p>
<div class="masonry" id="photosGrid"></div>
</section>

<!-- VIDEO SECTION -->
<section class="section" id="videos">
<h2>Video Gallery</h2>
<p class="subtitle">
Watch our cinematic films directly here.
</p>
<div class="videos" id="videoGrid"></div>
</section>

</main>

<footer>
© <span id="year"></span> Subhomoments ·
<a href="index.html">Back to Home</a>
</footer>

<!-- FULL-SCREEN PHOTO VIEWER -->
<div class="lightbox" id="lightbox"
role="dialog" aria-modal="true"
aria-label="Photo preview">

<button class="close" id="close"
aria-label="Close">×</button>

<img id="fullImage" alt="Gallery photograph">
</div>

<script>

/*
========================================
EDIT YOUR PHOTOS AND VIDEOS HERE
========================================

Upload photographs into your GitHub
repository's images/ folder.

Example photo:
"images/DSC_1390.JPG"

Example YouTube video:
{id:"YOUR_VIDEO_ID",title:"Wedding Highlights"}

A YouTube video ID is normally 11 characters.
For a URL:
https://www.youtube.com/watch?v=ABCDEFGHIJK

Use:
id:"ABCDEFGHIJK"

========================================
*/

const galleries={

wedding:{
name:"Wedding",
photos:[
"images/wedding1.jpg",
"images/wedding2.jpg",
"images/wedding3.jpg"
],
videos:[
// {id:"ABCDEFGHIJK",title:"Wedding Highlights"}
]
},

prewedding:{
name:"Pre-Wedding",
photos:[
"images/DSC_1390.JPG",
"images/DSC_1393.JPG",
"images/DSC_1400.JPG"
],
videos:[
// {id:"ABCDEFGHIJK",title:"Pre-Wedding Film"}
]
},

anniversary:{
name:"Anniversary",
photos:[
],
videos:[
]
},

engagement:{
name:"Engagement",
photos:[
],
videos:[
]
},

birthday:{
name:"Birthday",
photos:[
],
videos:[
]
},

babyshower:{
name:"Baby Shower",
photos:[
],
videos:[
]
},

riceceremony:{
name:"Rice Ceremony",
photos:[
"images/rice1.jpg",
"images/rice2.jpg",
"images/rice3.jpg"
],
videos:[
]
}

};

/* READ SELECTED CATEGORY FROM URL */

const params=new URLSearchParams(window.location.search);
const selected=params.get("category")||"all";

const key=selected==="all"||galleries[selected]
?selected
:"all";

/* CREATE CATEGORY BUTTONS */

const categories=document.getElementById("categories");

const choices=[
["all","All"],
...Object.entries(galleries).map(
([id,data])=>[id,data.name]
)
];

choices.forEach(([id,label])=>{
const a=document.createElement("a");

a.href="gallery.html?category="+id;
a.textContent=label;

if(id===key){
a.className="active";
a.setAttribute("aria-current","page");
}

categories.append(a);
});

/* SET PAGE TITLE */

document.getElementById("pageTitle").textContent=
key==="all"
?"All Galleries"
:galleries[key].name+" Gallery";

/* SELECT PHOTO AND VIDEO COLLECTIONS */

const active=key==="all"
?Object.values(galleries)
:[galleries[key]];

const photos=active.flatMap(g=>
g.photos.map(src=>({src,name:g.name}))
);

const videos=active.flatMap(g=>g.videos);

/* RENDER PHOTOS */

const photosGrid=document.getElementById("photosGrid");

photos.forEach(({src,name})=>{

const button=document.createElement("button");
button.className="photo";
button.type="button";
button.setAttribute(
"aria-label","View "+name+" photograph"
);

const img=document.createElement("img");
img.src=src;
img.alt=name+" photography";
img.loading="lazy";

/* REMOVE MISSING IMAGE FILES */

img.onerror=()=>{
button.remove();

if(!photosGrid.querySelector(".photo")){
photosGrid.innerHTML=
'<p class="empty">No photos available yet. Add your images to the images folder.</p>';
}
};

button.append(img);

/* OPEN ORIGINAL PHOTO */

button.onclick=()=>{
document.getElementById("fullImage").src=src;
document.getElementById("lightbox").classList.add("open");
document.body.style.overflow="hidden";
};

photosGrid.append(button);
});

if(!photos.length){
photosGrid.innerHTML=
'<p class="empty">Photos coming soon. Add image paths in the galleries settings.</p>';
}

/* RENDER YOUTUBE VIDEOS */

const videoGrid=document.getElementById("videoGrid");

videos.forEach(v=>{

if(!/^[A-Za-z0-9_-]{11}$/.test(v.id)){
return;
}

const card=document.createElement("article");
card.className="video";

const frame=document.createElement("iframe");

frame.src=
"https://www.youtube-nocookie.com/embed/"+
encodeURIComponent(v.id);

frame.title=v.title||"Wedding film";
frame.loading="lazy";
frame.allow=
"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
frame.allowFullscreen=true;

const heading=document.createElement("h3");
heading.textContent=v.title||"Cinematic film";

card.append(frame,heading);
videoGrid.append(card);
});

if(!videoGrid.children.length){
videoGrid.innerHTML=
'<p class="empty">Videos coming soon. Add your YouTube video IDs in the galleries settings.</p>';
}

/* PHOTO VIEWER CLOSE BUTTON */

const lightbox=document.getElementById("lightbox");

function closeBox(){
lightbox.classList.remove("open");
document.body.style.overflow="";
}

document.getElementById("close").onclick=closeBox;

lightbox.onclick=e=>{
if(e.target===lightbox)closeBox();
};

document.addEventListener("keydown",e=>{
if(e.key==="Escape")closeBox();
});

/* COPYRIGHT YEAR */

document.getElementById("year").textContent=
new Date().getFullYear();

</script>

</body>
</html>
